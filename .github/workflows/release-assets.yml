name: Attach release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: uv run python scripts/verify_dist_contents.py dist

      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.whl dist/*.tar.gz --clobber
